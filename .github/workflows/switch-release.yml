# Deliberate release of the CMake game image. Tags are SemVer (owner decision
# 2026-10-31, docs/RELEASES.md):
#   v0.9.0-preview.N, v1.0.0-rc.N  -> GitHub prerelease, not "latest"
#   v0.9.0, v1.0.0                 -> normal release, marked "latest"
#   v0.6.5-preview.N               -> the old series (1 to 57), still accepted
# CI job `switch` in ci.yml still builds the Makefile host_hello sample.
# CI job `switch-game` builds this same game .nro on pull requests and
# does not create a Release.
name: switch-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag: vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-rc.N (for example v0.9.0-preview.1)"
        required: true
        type: string
  push:
    tags:
      # A glob, not a regex: the step below checks the exact shape with
      # tools/dw3_nro_version.py --release-kind and fails on anything else.
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check the tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          case "$tag" in
            *[!A-Za-z0-9._-]*)
              echo "tag has characters outside A-Za-z0-9._-" >&2
              exit 1
              ;;
          esac
          # Exactly vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-rc.N; prints
          # RELEASE_KIND / RELEASE_PRERELEASE / RELEASE_LATEST / RELEASE_TITLE.
          python3 tools/dw3_nro_version.py --release-kind "$tag" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Init game submodules
        run: |
          git submodule update --init vendor/dw3_decomp vendor/psyz
          git -C vendor/psyz submodule update --init nugget external/SDL

      - name: Build the CMake game .nro
        # RELEASE_TAG (set above) becomes the NACP/hbmenu version via
        # tools/dw3_nro_version.py --github (e.g. v0.9.0-preview.12 → 0.9.0-p.12, v1.0.0-rc.1 → 1.0.0-rc.1, v1.0.0 → 1.0.0).
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          # Owner decision 2026-10-29: a release ships ONE .nro, the combined
          # US + EU image. The per-region and nxlink builds stay buildable
          # (tools/build_switch_game.sh, CI switch-game) but are not published.
          # nxlink is detected at run time by the one image.
          bash tools/build_switch_game.sh --both

      - name: Pack the release files
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          cp build/switch-both/dw3-switch.nro dist/dw3-switch.nro
          cp platforms/switch/release/README.txt dist/README.txt
          # The unstripped .elf of the .nro, so tools/symbolize_crash.py works
          # on this release (a local rebuild has a different build id). The
          # script fails if the .elf's build id is not the one in the .nro.
          python3 tools/pack_release_elfs.py --out dist/dw3-switch-elf.zip \
            --tag "$RELEASE_TAG" \
            --item dist/dw3-switch.nro build/switch-both/dw3-switch.elf dw3-switch.elf
          find dist -type f -printf '%f\n' | sort > /tmp/dist-got
          printf 'README.txt\ndw3-switch-elf.zip\ndw3-switch.nro\n' > /tmp/dist-want
          diff -u /tmp/dist-want /tmp/dist-got
          if find dist -type f \( -name '*.bin' -o -name '*.cue' -o -name '*.iso' -o -name '*.img' \) | grep -q .; then
            echo "refusing to publish disc images" >&2
            exit 1
          fi
          # The combined image has no region path of its own: it holds the
          # base folder and both game copies' dispatch table.
          nro=dist/dw3-switch.nro
          if grep -a -F -q 'sdmc:/switch/dw3' "$nro" && grep -a -F -q 'dw3-region: picker shown' "$nro"; then
            :
          else
            echo "$nro is not the combined game image" >&2
            exit 1
          fi
          # Full label is compiled into boot_main for the nxlink / sdmc log.
          if grep -a -F -q "dw3: version=" "$nro"; then
            :
          else
            echo "$nro missing dw3: version= boot string" >&2
            exit 1
          fi
          # Run-time nxlink detection must be in the one image.
          for s in 'dw3: no nxlink host' 'nxlink host='; do
            if grep -a -F -q "$s" "$nro"; then
              :
            else
              echo "$nro lacks the run-time nxlink check ($s)" >&2
              exit 1
            fi
          done
          nacp_expect="$(RELEASE_TAG="$RELEASE_TAG" python3 tools/dw3_nro_version.py --github --format nacp)"
          nacp=build/switch-both/dw3-switch.nacp
          got="$(python3 -c "from pathlib import Path; import sys; d=Path(sys.argv[1]).read_bytes(); print(d[0x3060:0x3070].split(b'\\0',1)[0].decode())" "$nacp")"
          if [ "$got" != "$nacp_expect" ]; then
            echo "$nacp display_version=$got expected=$nacp_expect" >&2
            exit 1
          fi

      - name: Publish the release
        # A prerelease tag (-preview.N, -rc.N) is a GitHub prerelease and never
        # "latest"; a plain vX.Y.Z is a normal release and is marked latest.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          make_latest: ${{ env.RELEASE_LATEST }}
          generate_release_notes: false
          body_path: platforms/switch/release/README.txt
          fail_on_unmatched_files: true
          files: |
            dist/dw3-switch.nro
            dist/dw3-switch-elf.zip
            dist/README.txt

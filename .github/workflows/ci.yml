name: ci

on:
  push:
    branches: [main, phase1-toolchains-hosts, phase2-engine, phase2-io]
  pull_request:

# A new push to a pull request supersedes the run still going for the old one.
# Runs on main (and other branches) are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build speed (docs/BUILD_SPEED.md): ccache for every game compile, restored
# from and saved to the Actions cache (one cache per job, newest wins), shallow
# submodule clones, and the Python tests in their own job so they run beside
# the builds instead of after them. The release workflow does not use ccache.
env:
  CCACHE_MAXSIZE: 400M

jobs:
  # Docs-only changes (docs/**, *.md) skip the build jobs below. Skipped jobs
  # count as passing for required status checks, so docs PRs stay mergeable.
  # This is done in-job rather than with paths-ignore, which would leave a
  # required check stuck on "Expected - waiting".
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, force push): build to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE...$GITHUB_SHA")
          echo "$files"
          code=$(echo "$files" | grep -vE '^docs/|\.md$' | grep -q . && echo true || echo false)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Runs on every push and PR, docs-only included: tools-tests is skipped for
  # docs-only changes, and a doc missing from docs/README.md slipped in that way.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Doc links and docs index
        run: python3 tools/check_doc_links.py

  pc:
    needs: changes
    # Build unless changes positively said docs-only; if changes itself
    # fails, its output is empty and the builds still run (no false green).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Init PC submodules
        run: |
          # Shallow: only the pinned commits are needed (not their history).
          git submodule update --init --depth 1 vendor/dw3_decomp vendor/psyz
          # Both hosts use nugget/bsdec; skip its PS1 matching toolchain.
          git -C vendor/psyz submodule update --init --depth 1 nugget external/SDL
      - name: Check decomp patches
        run: tools/apply_patches.sh --check
      - name: Install deps
        run: |
          # Prefer apt packages over SDL_*_OFF flags (see docs/PSYZ.md).
          # Core: cmake/ninja/GL. XSS + ALSA/Pulse avoid screensaver/audio OFF.
          # X11/EGL/wayland bits keep SDL3 configure happy on Ubuntu runners.
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libdecor-0-dev
      - name: ccache environment
        run: |
          . tools/dw3_ccache_env.sh
          export DW3_CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          dw3_ccache_setup "$GITHUB_WORKSPACE"
          env | grep '^CCACHE_' >> "$GITHUB_ENV"
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-pcus-${{ github.sha }}
          restore-keys: ccache-pcus-
      - name: Configure & build PC host
        run: |
          ccache -z
          cmake -S platforms/pc -B build/pc -G Ninja -DPSYZ_RENDERER=sdl3_gpu
          cmake --build build/pc -j"$(nproc)"
          test -x build/pc/dw3-pc
      - name: ccache statistics
        run: ccache -s
      - name: Save ccache
        if: ${{ success() }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-pcus-${{ github.sha }}

  # P6.24: the PC host with both regions in one image. A job of its own so it
  # runs beside `pc` (its two configures were the longest part of that job).
  pc-both:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Init PC submodules
        run: |
          git submodule update --init --depth 1 vendor/dw3_decomp vendor/psyz
          git -C vendor/psyz submodule update --init --depth 1 nugget external/SDL
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libdecor-0-dev
      - name: ccache environment
        run: |
          . tools/dw3_ccache_env.sh
          export DW3_CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          dw3_ccache_setup "$GITHUB_WORKSPACE"
          env | grep '^CCACHE_' >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-pcboth-${{ github.sha }}
          restore-keys: ccache-pcboth-
      - name: Configure & build PC host, both regions in one image (P6.24)
        run: |
          ccache -z
          cmake -S platforms/pc -B build/pc-both -G Ninja -DPSYZ_RENDERER=sdl3_gpu \
            -DDW3_VERSION=both
          cmake --build build/pc-both -j"$(nproc)"
          test -x build/pc-both/dw3-pc
          # Each game copy exports one symbol, its table; the rest is local.
          for r in us eu; do
            test "$(nm -g --defined-only build/pc-both/port-$r/game_$r.o | awk '{print $3}')" = "${r}_dw3_game_api"
          done
          # A region typo stops before any window or data is touched.
          set +e
          build/pc-both/dw3-pc --region xx 2> build/pc-both/region-typo.log
          rc=$?
          set -e
          test "$rc" = 1
          grep -q 'must be us or eu' build/pc-both/region-typo.log
      - name: ccache statistics
        run: ccache -s
      - name: Save ccache
        if: ${{ success() }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-pcboth-${{ github.sha }}

  # The Python/C unit tests need no PC build (the decomp patch check and the
  # host-side test programs compile on their own), so they run beside `pc`.
  tools-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Init submodules
        run: |
          # The tests need the decomp and the psyz headers, not SDL or nugget.
          git submodule update --init --depth 1 vendor/dw3_decomp vendor/psyz
      - name: Unit tests (tools)
        run: |
          # Pillow: replay/menu replay tests import PIL directly (importorskip
          # on main, hard import on menu-replay branches); install so they run.
          # xdist: the tests are independent; a few compile C and dominate.
          python3 -m pip install pytest pytest-xdist pillow
          python3 -m pytest tools/tests -v -n auto --dist worksteal --durations=8

  # Makefile host_hello sample (EGL + audren). Not the game image.
  # The game .nro is job switch-game below, and a Release only from
  # .github/workflows/switch-release.yml.
  switch:
    needs: changes
    # Build unless changes positively said docs-only; if changes itself
    # fails, its output is empty and the builds still run (no false green).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build sample .nro in devkitA64
        run: |
          docker run --rm \
            -e DEVKITPRO=/opt/devkitpro \
            -v "$PWD:/dw3-switch" -w /dw3-switch \
            devkitpro/devkita64:latest \
            make -C platforms/switch
          test -f platforms/switch/dw3-switch.nro

  switch-game:
    needs: changes
    # Build unless changes positively said docs-only; if changes itself
    # fails, its output is empty and the builds still run (no false green).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DW3_CCACHE_FETCH: "1"
      DW3_CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # Tags help local-style git describe; PR builds still prefer short SHA
          # via GITHUB_SHA in tools/dw3_nro_version.py --github.
          fetch-depth: 0
      - name: Init game submodules
        run: |
          git submodule update --init --depth 1 vendor/dw3_decomp vendor/psyz
          # nugget without --recursive: codeberg xmake-psx returns HTTP 429.
          git -C vendor/psyz submodule update --init --depth 1 nugget external/SDL
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-switch-game-${{ github.sha }}
          restore-keys: ccache-switch-game-
      - name: Build CMake game .nro
        # Untagged CI: NACP/hbmenu version is the short GITHUB_SHA (e.g. a0e4973).
        # Tagged releases use switch-release.yml + RELEASE_TAG instead.
        run: bash tools/build_switch_game.sh
      - name: Save ccache
        if: ${{ success() }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-switch-game-${{ github.sha }}
      - name: Upload game .nro artifact
        uses: actions/upload-artifact@v7
        with:
          name: dw3-switch-game-nro
          path: build/switch/dw3-switch.nro
          if-no-files-found: error

  # P6.24 PR B: the combined US + EU game .nro (DW3_VERSION=both), ordinary and
  # nxlink. An artifact only; since 2026-10-29 the release workflow publishes the
  # ordinary combined image as the one dw3-switch.nro (nxlink variant: dev only).
  switch-game-both:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DW3_CCACHE_FETCH: "1"
      DW3_CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: Init game submodules
        run: |
          git submodule update --init --depth 1 vendor/dw3_decomp vendor/psyz
          git -C vendor/psyz submodule update --init --depth 1 nugget external/SDL
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-switch-both-${{ github.sha }}
          restore-keys: ccache-switch-both-
      - name: Build the combined .nro (ordinary and nxlink)
        run: |
          bash tools/build_switch_game.sh --both
          bash tools/build_switch_game.sh --both --nxlink
          mkdir -p dist-both
          cp build/switch-both/dw3-switch.nro dist-both/dw3-switch-both.nro
          cp build/switch-both-nxlink/dw3-switch-nxlink.nro dist-both/dw3-switch-both-nxlink.nro
      - name: Save ccache
        if: ${{ success() }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-switch-both-${{ github.sha }}
      - name: Upload combined .nro artifact
        uses: actions/upload-artifact@v7
        with:
          name: dw3-switch-both-nro
          path: dist-both/*.nro
          if-no-files-found: error

  # P6.24 slice 2: the Switch region launcher NRO (platforms/switch/launcher).
  # A CI artifact only; it is not a release asset yet, and the release
  # workflow does not know it. No submodules: it holds no game code.
  switch-launcher:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Build launcher .nro
        run: bash tools/build_switch_launcher.sh
      - name: Upload launcher .nro artifact
        uses: actions/upload-artifact@v7
        with:
          name: dw3-switch-launcher-nro
          path: build/switch-launcher/out/dw3.nro
          if-no-files-found: error

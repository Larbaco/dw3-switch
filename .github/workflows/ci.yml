name: ci

on:
  push:
    branches: [main, phase1-toolchains-hosts, phase2-engine, phase2-io]
  pull_request:

jobs:
  # Docs-only changes (docs/**, *.md) skip the build jobs below. Skipped jobs
  # count as passing for required status checks, so docs PRs stay mergeable.
  # This is done in-job rather than with paths-ignore, which would leave a
  # required check stuck on "Expected - waiting".
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, force push): build to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$GITHUB_SHA")
          echo "$files"
          code=$(echo "$files" | grep -vE '^docs/|\.md$' | grep -q . && echo true || echo false)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  pc:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init PC submodules
        run: |
          git submodule update --init vendor/dw3_decomp vendor/psyz
          # Both hosts use nugget/bsdec; skip its PS1 matching toolchain.
          git -C vendor/psyz submodule update --init nugget external/SDL
      - name: Check decomp patches
        run: tools/apply_patches.sh --check
      - name: Install deps
        run: |
          # Prefer apt packages over SDL_*_OFF flags (see docs/PSYZ.md).
          # Core: cmake/ninja/GL. XSS + ALSA/Pulse avoid screensaver/audio OFF.
          # X11/EGL/wayland bits keep SDL3 configure happy on Ubuntu runners.
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libdecor-0-dev
      - name: Configure & build PC host
        run: |
          cmake -S platforms/pc -B build/pc -G Ninja -DPSYZ_RENDERER=sdl3_gpu
          cmake --build build/pc -j"$(nproc)"
          test -x build/pc/dw3-pc
      - name: Unit tests (tools)
        run: |
          python3 -m pip install pytest
          python3 -m pytest tools/tests -v

  # Makefile host_hello sample (EGL + audren). Not the game image.
  # The game .nro is job switch-game below, and a Release only from
  # .github/workflows/switch-release.yml.
  switch:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sample .nro in devkitA64
        run: |
          docker run --rm \
            -e DEVKITPRO=/opt/devkitpro \
            -v "$PWD:/dw3-switch" -w /dw3-switch \
            devkitpro/devkita64:latest \
            make -C platforms/switch
          test -f platforms/switch/dw3-switch.nro

  switch-game:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # Tags help local-style git describe; PR builds still prefer short SHA
          # via GITHUB_SHA in tools/dw3_nro_version.py --github.
          fetch-depth: 0
      - name: Init game submodules
        run: |
          git submodule update --init vendor/dw3_decomp vendor/psyz
          # nugget without --recursive: codeberg xmake-psx returns HTTP 429.
          git -C vendor/psyz submodule update --init nugget external/SDL
      - name: Build CMake game .nro
        # Untagged CI: NACP/hbmenu version is the short GITHUB_SHA (e.g. a0e4973).
        # Tagged releases use switch-release.yml + RELEASE_TAG instead.
        run: bash tools/build_switch_game.sh
      - name: Upload game .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: dw3-switch-game-nro
          path: build/switch/dw3-switch.nro
          if-no-files-found: error
